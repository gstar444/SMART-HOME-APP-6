name: Build APK

on:
  workflow_dispatch:        # GitHub -> Actions -> Build APK -> "Run workflow"
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Errors/warnings are shown in the log but do not stop the APK build.
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test
        continue-on-error: true

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: smart-home-apk
          path: build/app/outputs/flutter-apk/*.apk
